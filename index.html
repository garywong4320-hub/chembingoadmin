<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUS Chem Bingo — Organizer</title>
<style>
  :root{
    --forest:#7c8fc4;
    --forest-deep:#5f78ad;
    --bg:#a9b7dd;
    --cream:#fdfaf3;
    --pink:#f3b6c9;
    --yellow:#f5df5a;
    --ink:#26314f;
    --pending:#f0a94e;
    --approved:#5a9e6f;
    --redo:#d9645f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--cream);
    min-height:100vh;
  }
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px;}
  h1{
    font-size:1.6rem;
    letter-spacing:0.5px;
    color:var(--yellow);
    text-align:center;
    margin:6px 0 2px;
    font-weight:800;
  }
  .sub{text-align:center;color:var(--cream);font-size:0.85rem;margin-bottom:22px;font-weight:600;}
  .card{
    background:var(--cream);
    color:var(--ink);
    border-radius:14px;
    padding:18px;
    margin-bottom:14px;
    box-shadow:0 4px 0 rgba(0,0,0,0.15);
  }
  .btn{
    display:block;
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
    margin-top:10px;
    background:var(--forest);
    color:var(--cream);
  }
  .btn.approve{background:var(--approved);color:#fff;}
  .btn.reject{background:var(--redo);color:#fff;}
  .team-list-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 12px;border-radius:8px;background:#fff;margin-top:8px;
    border:2px solid transparent;cursor:pointer;
  }
  .team-list-item:hover{border-color:var(--forest);}
  .progress{font-size:0.85rem;color:#555;}
  .grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:6px;
    margin-top:14px;
  }
  .tile{
    aspect-ratio:1/1;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:0.62rem;
    line-height:1.15;
    padding:5px;
    font-weight:700;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    color:#fff;
    background:#8a8a8a;
    border:2px solid rgba(0,0,0,0.1);
  }
  .tile.free{background:var(--pink);color:var(--ink);}
  .tile.pending{background:var(--pending);}
  .tile.approved{background:var(--approved);}
  .tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.35;}
  .tile span{position:relative;z-index:1;}
  .badge{
    position:absolute;top:3px;right:4px;font-size:0.9rem;z-index:2;
  }
  .top-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .top-nav button{background:none;border:none;color:var(--cream);font-weight:700;cursor:pointer;font-size:0.9rem;}
  .review-photo{width:100%;border-radius:10px;margin:10px 0;max-height:320px;object-fit:cover;}
  .warn{font-size:0.8rem;color:#a33;margin-top:8px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// PASTE your Apps Script Web App URL here (see AppsScript-Backend.gs setup steps)
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxe0qcs63ynGIQYnI13dgndPatQuTUPTa525H2T5wtjeFm0lD6pd_OdN2LS9yQB1LeU/exec";

const TASKS = [
  "A photo with someone you met since Y1SI",
  "A photo with the event IC",
  "\"Um AcTuAlLY\" pose",
  "A photo with a non-graduating person",
  "Take a photo doing a group cheer, like the last lab session just ended",
  "Take a group photo doing a funny pose",
  "Recreate your \"finally graduating\" pose",
  "Take a photo with someone who sat near you in your first-ever Chem lecture",
  "Take a photo recreating your best 'freshman orientation' face vs. now",
  "A photo with someone of the same age",
  "Take a photo doing a group toast to graduation",
  "Recreate this pose (see reference bingo card)",
  "FREE SPACE",
  "Recreate this pose (see reference bingo card)",
  "A photo with a new friend you met today",
  "Take a photo hugging a friend goodbye (dramatically)",
  "Recreate this pose (see reference bingo card)",
  "A photo with a faculty member",
  "Eating together",
  "Is wearing the same colored outfit as you",
  "Recreate this pose (see reference bingo card)",
  "Photo with your favourite element (periodic table outside CBL)",
  "Take a photo forming a heart shape as a group",
  "Recreate this pose (see reference bingo card)",
  "Take a group photo forming your graduating year (e.g. '2026') with your bodies/hands"
];
const FREE_INDEX = 12;

const app = document.getElementById('app');
const urlParams = new URLSearchParams(window.location.search);
const savedTeam = urlParams.get('team');
let state = savedTeam
  ? { view: 'organizer-team', teamName: savedTeam, pollTimer: null }
  : { view: 'organizer-list', teamName: null, pollTimer: null };

function sleep_(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }

// Retries with exponential backoff + jitter on network failure or a
// {error:'busy'} response (the backend returns 'busy' when it can't
// grab its write lock within 8s — happens only during real bursts).
async function callApi(action, payload, maxRetries){
  payload = payload || {};
  maxRetries = maxRetries == null ? 4 : maxRetries;
  for (let attempt = 0; attempt <= maxRetries; attempt++){
    try{
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(Object.assign({ action: action }, payload))
      });
      const json = await res.json();
      if (json && json.error === 'busy' && attempt < maxRetries){
        const base = Math.min(1000 * Math.pow(2, attempt), 8000);
        await sleep_(base / 2 + Math.random() * base / 2);
        continue;
      }
      return json;
    }catch(e){
      if (attempt < maxRetries){
        const base = Math.min(1000 * Math.pow(2, attempt), 8000);
        await sleep_(base / 2 + Math.random() * base / 2);
        continue;
      }
      console.error('API call failed after retries', action, e);
      return { error: 'network' };
    }
  }
}

function urlConfigured(){
  return APPS_SCRIPT_URL && APPS_SCRIPT_URL.indexOf('PASTE_') === -1;
}

function render(){
  if (!urlConfigured()){
    app.innerHTML = `
      <h1>NUS Chem Bingo</h1>
      <div class="card">
        <p><strong>Setup needed:</strong> this page isn't connected to your Google Sheet yet.</p>
        <p class="warn">Open this file, replace APPS_SCRIPT_URL near the top with your Apps Script Web App URL, and re-publish.</p>
      </div>`;
    return;
  }
  if (state.view === 'organizer-list') return renderOrganizerList();
  if (state.view === 'organizer-team') return renderOrganizerTeam();
}

async function renderOrganizerList(){
  const rows = await callApi('listAllTeamsSummary');
  const list = Array.isArray(rows) ? rows : [];
  app.innerHTML = `
    <div class="top-nav"><span>&nbsp;</span><button id="refresh">Refresh</button></div>
    <h1>Organizer Dashboard</h1>
    <div class="sub">${list.length} team(s) registered</div>
    <div class="card">
      ${list.length===0 ? '<p>No teams have joined yet.</p>' : list.map(r => `
        <div class="team-list-item" data-team="${r.name}">
          <span>${r.name}</span>
          <span style="display:flex;align-items:center;gap:10px;">
            <span class="progress">${r.approved}/25 ✅ &nbsp; ${r.pending>0? r.pending+' ⏳ pending':''}</span>
            <button class="delete-btn" data-team-delete="${r.name}" style="background:var(--redo);color:#fff;border:none;border-radius:6px;padding:5px 8px;font-size:0.75rem;cursor:pointer;">🗑</button>
          </span>
        </div>
      `).join('')}
    </div>
  `;
  document.getElementById('refresh').onclick = () => render();
  app.querySelectorAll('.team-list-item').forEach(el => {
    el.onclick = () => {
      const name = el.dataset.team;
      state.teamName = name; state.view = 'organizer-team';
      history.replaceState(null, '', '?team=' + encodeURIComponent(name));
      render();
    };
  });
  app.querySelectorAll('[data-team-delete]').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      const name = btn.dataset.teamDelete;
      if (!confirm(`Delete "${name}" and all their submitted photos? This can't be undone.`)) return;
      btn.textContent = '...'; btn.disabled = true;
      const result = await callApi('deleteTeam', { teamName: name });
      if (!result || result.error){
        alert('Delete failed (connection issue) — please try again.');
        btn.textContent = '🗑'; btn.disabled = false;
        return;
      }
      render();
    };
  });
}

async function renderOrganizerTeam(){
  app.innerHTML = `<div class="card"><p>Loading ${state.teamName}'s board...</p></div>`;
  const data = await callApi('getTeam', { teamName: state.teamName });
  const tiles = (data && data.tiles) ? data.tiles : {};
  tiles[FREE_INDEX] = { status: 'approved', photoUrl: null };
  const approvedCount = Object.values(tiles).filter(t => t.status === 'approved').length;

  app.innerHTML = `
    <div class="top-nav"><button id="back">&larr; All teams</button><span>${approvedCount}/25 approved</span></div>
    <h1>${state.teamName}</h1>
    <div class="sub">Tap a pending tile to review</div>
    <div class="grid" id="grid"></div>
  `;
  const grid = document.getElementById('grid');
  TASKS.forEach((task, i) => {
    const t = tiles[i];
    const div = document.createElement('div');
    let cls = 'tile';
    if (i === FREE_INDEX) cls += ' free';
    else if (t && t.status === 'pending') cls += ' pending';
    else if (t && t.status === 'approved') cls += ' approved';
    div.className = cls;
    div.innerHTML = `${t && t.photoUrl ? `<img src="${t.photoUrl}">` : ''}<span>${task}</span>${t && t.status==='approved' ? '<span class="badge">✅</span>' : ''}${t && t.status==='pending' ? '<span class="badge">⏳</span>' : ''}`;
    if (t && t.status === 'pending'){
      div.onclick = () => openReview(i, t, task);
    }
    grid.appendChild(div);
  });
  document.getElementById('back').onclick = () => {
    state.view = 'organizer-list'; state.teamName = null;
    history.replaceState(null, '', window.location.pathname);
    render();
  };
}

function openReview(index, tileData, taskText){
  app.innerHTML = `
    <div class="top-nav"><button id="back">&larr; Cancel</button><span></span></div>
    <h1>Review Photo</h1>
    <div class="card">
      <p style="font-weight:700">${taskText}</p>
      <img class="review-photo" src="${tileData.photoUrl}">
      <button class="btn approve" id="approveBtn">✅ Approve</button>
      <button class="btn reject" id="rejectBtn">❌ Reject &amp; ask redo</button>
    </div>
  `;
  document.getElementById('back').onclick = () => { state.view = 'organizer-team'; render(); };
  document.getElementById('approveBtn').onclick = async () => {
    const btn = document.getElementById('approveBtn');
    btn.disabled = true; btn.textContent = 'Approving...';
    const result = await callApi('approveTile', { teamName: state.teamName, tileIndex: index });
    if (!result || result.error){
      alert('Approve failed (connection issue) — please try again.');
      btn.disabled = false; btn.textContent = '✅ Approve';
      return;
    }
    state.view = 'organizer-team'; render();
  };
  document.getElementById('rejectBtn').onclick = async () => {
    const btn = document.getElementById('rejectBtn');
    btn.disabled = true; btn.textContent = 'Rejecting...';
    const result = await callApi('rejectTile', { teamName: state.teamName, tileIndex: index });
    if (!result || result.error){
      alert('Reject failed (connection issue) — please try again.');
      btn.disabled = false; btn.textContent = '❌ Reject & ask redo';
      return;
    }
    state.view = 'organizer-team'; render();
  };
}

function startPolling(){
  stopPolling();
  // Jittered interval (45-55s) so if you have multiple organizers
  // reviewing at once, they don't all poll on the exact same tick.
  const interval = 450000 + Math.random() * 10000;
  state.pollTimer = setInterval(() => {
    if (state.view === 'organizer-list' || state.view === 'organizer-team') render();
  }, interval);
}
function stopPolling(){
  if (state.pollTimer) clearInterval(state.pollTimer);
  state.pollTimer = null;
}

render();
startPolling();
</script>
</body>
</html>
